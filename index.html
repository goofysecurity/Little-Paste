<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoPaste</title>
    <style>
        /* Monochrome Theme Variables */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --border-color: #cccccc;
            --accent-color: #000000;
            --hover-bg: #f5f5f5;
            --muted-text: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --border-color: #333333;
                --accent-color: #ffffff;
                --hover-bg: #1a1a1a;
                --muted-text: #888888;
            }
        }

        /* Basic Reset & Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        /* Toolbar & Buttons */
        .toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
        }

        .btn:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--text-color);
            opacity: 0.9;
        }

        /* Hide the default file input styling */
        input[type="file"] {
            display: none;
        }

        /* Main Editor */
        .editor-container {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 450px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        /* Footer / Status */
        footer {
            font-size: 0.8rem;
            color: var(--muted-text);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="site-logo">mono//paste</h1>
        <div class="toolbar">
            <label for="file-upload" class="btn" id="upload-label">
                <span>Upload File</span>
                <input type="file" id="file-upload" accept=".txt,.js,.py,.html,.css,.json,.md" />
            </label>
            <button class="btn btn-primary" id="btn-save">Create Paste</button>
        </div>
    </header>

    <main>
        <div class="editor-container">
            <textarea id="paste-input" placeholder="Paste your text or code here, or upload a file..."></textarea>
        </div>
    </main>

    <footer>
        <span id="char-count">0 characters</span>
        <span>A clean, minimalist space for text.</span>
    </footer>

    <script>
        const pasteInput = document.getElementById('paste-input');
        const fileUpload = document.getElementById('file-upload');
        const btnSave = document.getElementById('btn-save');
        const charCount = document.getElementById('char-count');
        const siteLogo = document.getElementById('site-logo');
        const uploadLabel = document.getElementById('upload-label');

        // CHANGE THIS URL LATER: Put your actual live backend website link here once deployed.
        // Leave it as localhost for now if testing locally.
        const API_URL = 'http://localhost:5000/api/pastes';

        // 1. Handle File Upload/Loading
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                pasteInput.value = event.target.result;
                updateCharCount();
            };
            reader.readAsText(file);
        });

        // 2. Update Character Count
        function updateCharCount() {
            const count = pasteInput.value.length;
            charCount.textContent = `${count.toLocaleString()} character${count === 1 ? '' : 's'}`;
        }
        pasteInput.addEventListener('input', updateCharCount);

        // 3. Handle Saving a Paste to the Database
        btnSave.addEventListener('click', async () => {
            const content = pasteInput.value.trim();
            if (!content) {
                alert('Please enter some text before creating a paste.');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const data = await response.json();

                if (response.ok) {
                    // Generates the shareable URL using your browser link + the new ID
                    const shareableUrl = `${window.location.origin}${window.location.pathname}?id=${data.shortId}`;
                    alert(`Paste saved successfully!\n\nShareable Link:\n${shareableUrl}`);
                    window.location.search = `?id=${data.shortId}`; // Automatically opens the link
                } else {
                    alert('Database Error: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Could not connect to the backend database. Make sure your server is running!');
            }
        });

        // 4. Handle Loading an Existing Shared Paste on Page Load
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pasteId = urlParams.get('id');

            if (pasteId) {
                siteLogo.textContent = `mono//paste [${pasteId}]`;
                pasteInput.placeholder = "Loading shared paste...";
                pasteInput.readOnly = true;
                uploadLabel.style.display = 'none';
                btnSave.style.display = 'none';

                try {
                    const response = await fetch(`${API_URL}/${pasteId}`);
                    const data = await response.json();

                    if (response.ok) {
                        pasteInput.value = data.content;
                        updateCharCount();
                    } else {
                        pasteInput.value = `Error: ${data.error || 'Failed to load paste.'}`;
                    }
                } catch (err) {
                    pasteInput.value = "Error: Cannot connect to the backend server.";
                }
            }
        });
    </script>
</body>
</html>
